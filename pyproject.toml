[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-foundry"
version = "0.1.0"
description = "AI research update workflows"
requires-python = ">=3.12,<3.13"

[project.scripts]
ai-updates = "ai_foundry.projects.ai_updates.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_foundry.projects.ai_updates" = ["prompts/*.txt"]
